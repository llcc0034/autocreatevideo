x-backend-environment: &backend-environment
  AUTOPROMPT_DEPLOYMENT_PROFILE: "production"
  DATABASE_URL: "postgresql://${POSTGRES_USER:-autoprompt}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-autoprompt}"
  DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?set a unique 50+ character DJANGO_SECRET_KEY in .env}"
  AUTOPROMPT_JWT_SIGNING_KEY: "${AUTOPROMPT_JWT_SIGNING_KEY:?set an independent 32+ byte JWT signing key in .env}"
  AUTOPROMPT_CONFIG_MASTER_KEYS: "${AUTOPROMPT_CONFIG_MASTER_KEYS:?set the database credential encryption keyring in the deployment secret manager}"
  AUTOPROMPT_CONFIG_ACTIVE_KEY_ID: "${AUTOPROMPT_CONFIG_ACTIVE_KEY_ID:?set the active database credential encryption key id}"
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:?set the public hostname and backend in .env}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?set the exact HTTPS frontend origin in .env}"
  CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:?set the exact HTTPS frontend origin in .env}"
  SECURE_SSL_REDIRECT: "true"
  SESSION_COOKIE_SECURE: "true"
  CSRF_COOKIE_SECURE: "true"
  SECURE_HSTS_SECONDS: "${SECURE_HSTS_SECONDS:-31536000}"
  SECURE_HSTS_INCLUDE_SUBDOMAINS: "${SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}"
  SECURE_HSTS_PRELOAD: "${SECURE_HSTS_PRELOAD:-false}"
  DRF_NUM_PROXIES: "${DRF_NUM_PROXIES:-2}"
  SERVE_ASSETS_WITH_DJANGO: "false"
  COMFYUI_ALLOW_NON_LOOPBACK: "${COMFYUI_ALLOW_NON_LOOPBACK:-true}"
  COMFYUI_EXTRA_ALLOWED_NODE_TYPES: "${COMFYUI_EXTRA_ALLOWED_NODE_TYPES:-}"
  COMFYUI_OUTPUT_DIR: "/comfyui-output"
  AI_PROVIDER_ALLOWED_HOSTS: "${AI_PROVIDER_ALLOWED_HOSTS:-localhost,127.0.0.1,::1}"
  TASK_MAX_CONCURRENT: "${TASK_MAX_CONCURRENT:-1}"
  FFMPEG_BINARY: "ffmpeg"
  FFPROBE_BINARY: "ffprobe"
  ASSEMBLY_AI_LABEL_FONTFILE: "${ASSEMBLY_AI_LABEL_FONTFILE:-}"
  TASK_DISTRIBUTION_FONTFILE: "${TASK_DISTRIBUTION_FONTFILE:-}"

x-app-security: &app-security
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=512m

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-autoprompt}"
      POSTGRES_USER: "${POSTGRES_USER:-autoprompt}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set a unique URL-safe 20+ character POSTGRES_PASSWORD in .env}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    shm_size: 256m

  backend:
    <<: *app-security
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *backend-environment
      AUTOPROMPT_BOOTSTRAP: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./assets:/app/assets:ro
      - "${COMFYUI_OUTPUT_HOST_DIR:?set COMFYUI_OUTPUT_HOST_DIR in .env}:/comfyui-output:ro"
      - backend-media:/app/backend/media
      - backend-static:/app/backend/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/api/v1/health/live/', headers={'Host':'backend','X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s

  worker:
    <<: *app-security
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    command: ["python", "manage.py", "run_generation_worker"]
    environment:
      <<: *backend-environment
      AUTOPROMPT_BOOTSTRAP: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./assets:/app/assets:ro
      - "${COMFYUI_OUTPUT_HOST_DIR:?set COMFYUI_OUTPUT_HOST_DIR in .env}:/comfyui-output:ro"
      - backend-media:/app/backend/media
    depends_on:
      backend:
        condition: service_healthy

  text-generation-worker:
    <<: *app-security
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    command: ["python", "manage.py", "run_text_generation_worker"]
    environment:
      <<: *backend-environment
      AUTOPROMPT_BOOTSTRAP: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./assets:/app/assets:ro
      - backend-media:/app/backend/media
    depends_on:
      backend:
        condition: service_healthy

  async-media-worker:
    <<: *app-security
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    command: ["python", "manage.py", "run_async_media_worker"]
    environment:
      <<: *backend-environment
      AUTOPROMPT_BOOTSTRAP: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./assets:/app/assets:ro
      - backend-media:/app/backend/media
    depends_on:
      backend:
        condition: service_healthy

  assembly-worker:
    <<: *app-security
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    command: ["python", "manage.py", "run_assembly_worker"]
    environment:
      <<: *backend-environment
      AUTOPROMPT_BOOTSTRAP: "false"
    volumes:
      - "${COMFYUI_OUTPUT_HOST_DIR:?set COMFYUI_OUTPUT_HOST_DIR in .env}:/comfyui-output:ro"
      - backend-media:/app/backend/media
    depends_on:
      backend:
        condition: service_healthy

  platform-maintenance:
    <<: *app-security
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["python", "manage.py", "run_platform_maintenance"]
    environment:
      <<: *backend-environment
      AUTOPROMPT_BOOTSTRAP: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${COMFYUI_OUTPUT_HOST_DIR:?set COMFYUI_OUTPUT_HOST_DIR in .env}:/comfyui-output:ro"
      - backend-media:/app/backend/media
    depends_on:
      backend:
        condition: service_healthy

  readiness:
    <<: *app-security
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    command: ["python", "-c", "import time; time.sleep(1000000000)"]
    environment:
      AUTOPROMPT_BOOTSTRAP: "false"
    depends_on:
      backend:
        condition: service_healthy
      worker:
        condition: service_started
      text-generation-worker:
        condition: service_started
      async-media-worker:
        condition: service_started
      assembly-worker:
        condition: service_started
      platform-maintenance:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request=urllib.request.Request('http://backend:8000/api/v1/health/ready/', headers={'Host':'backend','X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    <<: *app-security
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    volumes:
      - ./assets:/srv/autoprompt-assets:ro
      - backend-static:/srv/autoprompt-static:ro
    depends_on:
      readiness:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
  backend-media:
  backend-static:
