      DEEPSEEK_CREATIVE_OUTPUT_TOKENS_PER_SHOT: "${DEEPSEEK_CREATIVE_OUTPUT_TOKENS_PER_SHOT:-384}"
      DEEPSEEK_CREATIVE_OUTPUT_TOKENS_PER_DIALOGUE: "${DEEPSEEK_CREATIVE_OUTPUT_TOKENS_PER_DIALOGUE:-128}"
      DEEPSEEK_CREATIVE_OUTPUT_DIALOGUE_CHAR_THRESHOLD: "${DEEPSEEK_CREATIVE_OUTPUT_DIALOGUE_CHAR_THRESHOLD:-32}"
      DEEPSEEK_CREATIVE_MAX_SOURCE_CHARS: "${DEEPSEEK_CREATIVE_MAX_SOURCE_CHARS:-24000}"
      DEEPSEEK_CREATIVE_MAX_REGENERATION_CONTEXT_CHARS: "${DEEPSEEK_CREATIVE_MAX_REGENERATION_CONTEXT_CHARS:-96000}"
      DEEPSEEK_CREATIVE_MAX_INPUT_CHARS: "${DEEPSEEK_CREATIVE_MAX_INPUT_CHARS:-120000}"
      DEEPSEEK_CREATIVE_OUTPUT_HEADROOM_PER_SHOT: "${DEEPSEEK_CREATIVE_OUTPUT_HEADROOM_PER_SHOT:-384}"
      PROMPT_TRANSLATION_DEFAULT_PROVIDER: "${PROMPT_TRANSLATION_DEFAULT_PROVIDER:-local_qwen}"
      PROMPT_CREATIVE_DEFAULT_PROVIDER: "${PROMPT_CREATIVE_DEFAULT_PROVIDER:-local_qwen}"
      QWEN_CREATIVE_MIN_SHOTS: "${QWEN_CREATIVE_MIN_SHOTS:-1}"
      QWEN_CREATIVE_RECOMMENDED_MAX_SHOTS: "${QWEN_CREATIVE_RECOMMENDED_MAX_SHOTS:-4}"
      QWEN_CREATIVE_BATCH_SHOTS: "${QWEN_CREATIVE_BATCH_SHOTS:-4}"
      QWEN_CREATIVE_MAX_DIALOGUE_PER_SHOT: "${QWEN_CREATIVE_MAX_DIALOGUE_PER_SHOT:-2}"
      QWEN_CREATIVE_MAX_EPISODE_TITLE_CHARS: "${QWEN_CREATIVE_MAX_EPISODE_TITLE_CHARS:-80}"
      QWEN_CREATIVE_MAX_DIALOGUE_TEXT_CHARS: "${QWEN_CREATIVE_MAX_DIALOGUE_TEXT_CHARS:-240}"
      QWEN_CREATIVE_MAX_DIALOGUE_DELIVERY_CHARS: "${QWEN_CREATIVE_MAX_DIALOGUE_DELIVERY_CHARS:-100}"
      QWEN_CREATIVE_MAX_DIALOGUE_DELIVERY_EN_CHARS: "${QWEN_CREATIVE_MAX_DIALOGUE_DELIVERY_EN_CHARS:-150}"
      QWEN_CREATIVE_MIN_SHOT_DURATION_MS: "${QWEN_CREATIVE_MIN_SHOT_DURATION_MS:-5000}"
      QWEN_CREATIVE_MAX_SHOT_DURATION_MS: "${QWEN_CREATIVE_MAX_SHOT_DURATION_MS:-15000}"
      QWEN_CREATIVE_OUTPUT_MIN_TOKENS: "${QWEN_CREATIVE_OUTPUT_MIN_TOKENS:-1024}"
      QWEN_CREATIVE_OUTPUT_BASE_TOKENS: "${QWEN_CREATIVE_OUTPUT_BASE_TOKENS:-768}"
      QWEN_CREATIVE_OUTPUT_TOKENS_PER_SHOT: "${QWEN_CREATIVE_OUTPUT_TOKENS_PER_SHOT:-384}"
      QWEN_CREATIVE_OUTPUT_TOKENS_PER_DIALOGUE: "${QWEN_CREATIVE_OUTPUT_TOKENS_PER_DIALOGUE:-128}"
      QWEN_CREATIVE_OUTPUT_DIALOGUE_CHAR_THRESHOLD: "${QWEN_CREATIVE_OUTPUT_DIALOGUE_CHAR_THRESHOLD:-32}"
      QWEN_CREATIVE_TIMEOUT_SECONDS: "${QWEN_CREATIVE_TIMEOUT_SECONDS:-900}"
      QWEN_CREATIVE_PROCESS_CLEANUP_GRACE_SECONDS: "${QWEN_CREATIVE_PROCESS_CLEANUP_GRACE_SECONDS:-60}"
      QWEN_CREATIVE_MAX_NEW_TOKENS: "${QWEN_CREATIVE_MAX_NEW_TOKENS:-3072}"
      QWEN_CREATIVE_CONTEXT_SIZE: "${QWEN_CREATIVE_CONTEXT_SIZE:-8192}"
      QWEN_CREATIVE_MIN_CONTEXT_SIZE: "${QWEN_CREATIVE_MIN_CONTEXT_SIZE:-8192}"
      QWEN_CREATIVE_MAX_CONTEXT_SIZE: "${QWEN_CREATIVE_MAX_CONTEXT_SIZE:-32768}"
      QWEN_CREATIVE_RESERVED_INPUT_TOKENS: "${QWEN_CREATIVE_RESERVED_INPUT_TOKENS:-2048}"
      QWEN_CREATIVE_MAX_SOURCE_CHARS: "${QWEN_CREATIVE_MAX_SOURCE_CHARS:-16000}"
      QWEN_CREATIVE_MAX_REGENERATION_CONTEXT_CHARS: "${QWEN_CREATIVE_MAX_REGENERATION_CONTEXT_CHARS:-16000}"
      QWEN_CREATIVE_MAX_INPUT_CHARS: "${QWEN_CREATIVE_MAX_INPUT_CHARS:-24000}"
      QWEN_CREATIVE_OUTPUT_HEADROOM_PER_SHOT: "${QWEN_CREATIVE_OUTPUT_HEADROOM_PER_SHOT:-0}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./assets:/app/assets:ro
      - "${COMFYUI_OUTPUT_HOST_DIR:?set COMFYUI_OUTPUT_HOST_DIR in .env}:/comfyui-output:ro"
      - backend-media:/app/backend/media
      - backend-static:/app/backend/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/api/v1/health/live/', headers={'Host':'backend','X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s

  worker:
    <<: *app-security
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    command: ["python", "manage.py", "run_generation_worker"]
    environment:
      <<: *backend-environment
      AUTOPROMPT_BOOTSTRAP: "false"
      DEEPSEEK_ENABLED: "${DEEPSEEK_ENABLED:-false}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-v4-flash}"
      DEEPSEEK_TIMEOUT_SECONDS: "${DEEPSEEK_TIMEOUT_SECONDS:-180}"
      DEEPSEEK_MAX_RETRIES: "${DEEPSEEK_MAX_RETRIES:-1}"
      DEEPSEEK_MAX_TOKENS: "${DEEPSEEK_MAX_TOKENS:-16384}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./assets:/app/assets:ro
      - "${COMFYUI_OUTPUT_HOST_DIR:?set COMFYUI_OUTPUT_HOST_DIR in .env}:/comfyui-output:ro"
      - backend-media:/app/backend/media
    depends_on:
      backend:
        condition: service_healthy

  assembly-worker:
    <<: *app-security
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    command: ["python", "manage.py", "run_assembly_worker"]
    environment:
      <<: *backend-environment
      AUTOPROMPT_BOOTSTRAP: "false"
    volumes:
      - "${COMFYUI_OUTPUT_HOST_DIR:?set COMFYUI_OUTPUT_HOST_DIR in .env}:/comfyui-output:ro"
      - backend-media:/app/backend/media
    depends_on:
      backend:
        condition: service_healthy

  readiness:
    <<: *app-security
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    command: ["python", "-c", "import time; time.sleep(1000000000)"]
    environment:
      AUTOPROMPT_BOOTSTRAP: "false"
    depends_on:
      backend:
        condition: service_healthy
      worker:
        condition: service_started
      assembly-worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request=urllib.request.Request('http://backend:8000/api/v1/health/ready/', headers={'Host':'backend','X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    <<: *app-security
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_SHOT_DETAIL_DRAFT_TIMEOUT_MS: "${VITE_SHOT_DETAIL_DRAFT_TIMEOUT_MS:-720000}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    volumes:
      - ./assets:/srv/autoprompt-assets:ro
      - backend-static:/srv/autoprompt-static:ro
    depends_on:
      readiness:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
  backend-media:
  backend-static:
