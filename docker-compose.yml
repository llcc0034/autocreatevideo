x-app-security: &app-security
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=512m

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-autoprompt}"
      POSTGRES_USER: "${POSTGRES_USER:-autoprompt}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set a unique URL-safe 20+ character POSTGRES_PASSWORD in .env}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    shm_size: 256m

  backend:
    <<: *app-security
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *backend-environment
      AUTOPROMPT_BOOTSTRAP: "true"
      # The API validates provider readiness; the generation worker receives
      # the same credential below because durable shot-detail items execute there.
      DEEPSEEK_ENABLED: "${DEEPSEEK_ENABLED:-false}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-v4-flash}"
      DEEPSEEK_TIMEOUT_SECONDS: "${DEEPSEEK_TIMEOUT_SECONDS:-180}"
      DEEPSEEK_MAX_RETRIES: "${DEEPSEEK_MAX_RETRIES:-1}"
      DEEPSEEK_MAX_TOKENS: "${DEEPSEEK_MAX_TOKENS:-16384}"
      DEEPSEEK_CREATIVE_MIN_SHOTS: "${DEEPSEEK_CREATIVE_MIN_SHOTS:-1}"
      DEEPSEEK_CREATIVE_RECOMMENDED_MAX_SHOTS: "${DEEPSEEK_CREATIVE_RECOMMENDED_MAX_SHOTS:-4}"
      DEEPSEEK_CREATIVE_BATCH_SHOTS: "${DEEPSEEK_CREATIVE_BATCH_SHOTS:-1}"
      DEEPSEEK_CREATIVE_MAX_DIALOGUE_PER_SHOT: "${DEEPSEEK_CREATIVE_MAX_DIALOGUE_PER_SHOT:-2}"
      DEEPSEEK_CREATIVE_MAX_EPISODE_TITLE_CHARS: "${DEEPSEEK_CREATIVE_MAX_EPISODE_TITLE_CHARS:-80}"
      DEEPSEEK_CREATIVE_MAX_DIALOGUE_TEXT_CHARS: "${DEEPSEEK_CREATIVE_MAX_DIALOGUE_TEXT_CHARS:-240}"
      DEEPSEEK_CREATIVE_MAX_DIALOGUE_DELIVERY_CHARS: "${DEEPSEEK_CREATIVE_MAX_DIALOGUE_DELIVERY_CHARS:-100}"
