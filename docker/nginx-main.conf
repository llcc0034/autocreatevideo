worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 30;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # The container is loopback-published behind a TLS terminator. Preserve
    # only an exact HTTPS assertion; every other value falls back to the local
    # connection scheme and Django's SSL redirect rejects it.
    map $http_x_forwarded_proto $autoprompt_forwarded_proto {
        default $scheme;
        ~*^https$ https;
    }

    # The anonymous report page carries a bearer credential in its path.  Do
    # not send that path back as Referer on the page's own JS/CSS requests.
    map $uri $autoprompt_referrer_policy {
        default same-origin;
        ~^/report/[^/]+/?$ no-referrer;
    }

    include /etc/nginx/conf.d/*.conf;
}
