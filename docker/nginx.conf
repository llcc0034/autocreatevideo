server {
    listen 8080;
    server_name _;
    client_max_body_size 260m;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
        access_log off;
        include /etc/nginx/security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $autoprompt_forwarded_proto;
        proxy_connect_timeout 5s;
        # API requests only validate or enqueue durable work. GPU generation
        # and FFmpeg assembly are owned by workers and must never keep an HTTP
        # request open for hours.
        proxy_read_timeout 125s;
        proxy_send_timeout 125s;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $autoprompt_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 125s;
        proxy_send_timeout 125s;
    }

    # Django admin and API documentation assets are collected during the
    # backend bootstrap into a dedicated read-only volume.
    location /static/ {
        alias /srv/autoprompt-static/;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    # The backend reads the original reference library from its read-only
    # mount and issues short-lived signed /api/v1/media/ URLs.  Keeping this
    # alias internal keeps repository paths behind signed API URLs and cannot
    # shadow Vite's /assets/*.js and CSS.
    location ^~ /assets/library/ {
        internal;
        alias /srv/autoprompt-assets/library/;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "private, no-store";
    }

    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        root /usr/share/nginx/html;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
