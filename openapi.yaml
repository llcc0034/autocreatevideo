      - created_at
      - download_url
      - dry_run
      - episode
      - error_message
      - ffmpeg_command
      - finished_at
      - has_audio
      - heartbeat_at
      - id
      - max_attempts
      - output_path
      - output_url
      - owner
      - project
      - provenance_url
      - queued_at
      - scope
      - source_contract_version
      - source_signature
      - source_tasks
      - started_at
      - status
      - updated_at
      - worker_id
