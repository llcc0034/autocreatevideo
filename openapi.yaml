components:
  schemas:
    APIValidationError:
      type: object
      description: The single envelope produced by ``api_exception_handler`` for 400s.
      properties:
        status_code:
          type: integer
        code:
          type: string
          maxLength: 64
        details: {}
      required:
      - code
      - details
      - status_code
    APIValidationErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/APIValidationError'
      required:
      - error
    AccessAuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          type: integer
          readOnly: true
          nullable: true
        actor_username:
          type: string
          readOnly: true
        target_user:
          type: integer
          readOnly: true
        target_username:
          type: string
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/AccessAuditEventActionEnum'
          readOnly: true
        before_role:
          type: string
          readOnly: true
        after_role:
          type: string
          readOnly: true
        before_active:
          type: boolean
          readOnly: true
          nullable: true
        after_active:
          type: boolean
          readOnly: true
          nullable: true
        reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - actor_username
      - after_active
      - after_role
      - before_active
      - before_role
      - created_at
      - id
      - reason
      - target_user
      - target_username
    AccessAuditEventActionEnum:
      enum:
      - create_user
      - change_role
      - change_status
      - reset_password
      - change_password
      - bootstrap_superuser
      type: string
      description: |-
        * `create_user` - 创建账号
        * `change_role` - 变更角色
        * `change_status` - 变更状态
        * `reset_password` - 重置临时密码
        * `change_password` - 用户修改密码
        * `bootstrap_superuser` - 初始化超级管理员
    AccessRoleChangeRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/AccessRoleEnum'
        reason:
          type: string
          maxLength: 500
      required:
      - role
    AccessRoleEnum:
      enum:
      - member
      - platform_admin
      - super_admin
      type: string
      description: |-
        * `member` - member
        * `platform_admin` - platform_admin
        * `super_admin` - super_admin
    AccessStatusChangeRequest:
      type: object
      properties:
        is_active:
          type: boolean
        reason:
          type: string
          maxLength: 500
      required:
      - is_active
    AccessUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: 用户名
          description: 必填；长度为150个字符或以下；只能包含字母、数字、特殊字符“@”、“.”、“-”和“_”。
        email:
          type: string
          format: email
          readOnly: true
          title: 电子邮件地址
        first_name:
          type: string
          readOnly: true
          title: 名字
        last_name:
          type: string
          readOnly: true
          title: 姓氏
        role:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: 有效
          description: 指明用户是否被认为是活跃的。以反选代替删除帐号。
        must_change_password:
          type: boolean
          readOnly: true
        password_changed_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: 上次登录
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: 加入日期
      required:
      - date_joined
      - email
      - first_name
      - id
      - is_active
      - last_login
      - last_name
      - must_change_password
      - password_changed_at
      - role
      - username
    AccessUserCreateRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/AccessRoleEnum'
          default: member
        reason:
          type: string
          maxLength: 500
      required:
      - username
    ActivationStateEnum:
      enum:
      - inactive
      - pending_activation
      - active
      - failed
      type: string
      description: |-
        * `inactive` - 未激活
        * `pending_activation` - 等待重启激活
        * `active` - 已激活
        * `failed` - 激活失败
    ApplyStatusEnum:
      enum:
      - not_started
      - complete
      type: string
      description: |-
        * `not_started` - 未应用
        * `complete` - 已全部应用
    ApprovalDecisionEnum:
      enum:
      - approve
      - reject
      type: string
      description: |-
        * `approve` - 通过
        * `reject` - 拒绝
    ApprovalDecisionInputRequest:
      type: object
      properties:
        stage_key:
          type: string
          minLength: 1
          maxLength: 100
        decision:
          $ref: '#/components/schemas/ApprovalDecisionEnum'
        comment:
          type: string
          default: ''
          maxLength: 4000
        candidate_overrides:
          type: object
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 8000
        expected_source_snapshot_sha256:
          type: string
          default: ''
          pattern: ^[0-9a-f]{64}$
        adopt_generated_metadata:
          type: boolean
          default: false
          description: 仅在批准 script_review 时可设为 true；服务端只采用冻结候选的 title/logline，并保留运行创建后发生的人工并发编辑。
      required:
      - decision
      - stage_key
