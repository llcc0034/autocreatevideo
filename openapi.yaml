  /api/v1/assemblies/:
    get:
      operationId: api_v1_assemblies_list
      parameters:
      - in: query
        name: dry_run
        schema:
          type: boolean
      - in: query
        name: episode
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: 用于排序结果的字段。
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: 每页返回的结果数量。
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: string
          format: uuid
      - in: query
        name: scope
        schema:
          type: string
          enum:
          - episode
          - series
        description: |-
          * `episode` - 单集
          * `series` - 整剧
      - name: search
        required: false
        in: query
        description: 搜索关键词。
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - failed
          - planned
          - queued
          - running
          - succeeded
        description: |-
          * `planned` - 已规划
          * `queued` - 排队中
          * `running` - 组装中
          * `succeeded` - 已完成
          * `failed` - 已失败
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssemblyJobList'
          description: ''
  /api/v1/assemblies/{id}/:
