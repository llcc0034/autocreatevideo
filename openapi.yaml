      - name: search
        required: false
        in: query
        description: 搜索关键词。
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccessUserList'
          description: ''
    post:
      operationId: api_v1_access_users_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessUserCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccessUserCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccessUserCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryPasswordResponse'
          description: ''
  /api/v1/access/users/{id}/:
    get:
      operationId: api_v1_access_users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 用户 的 唯一整数值。
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessUser'
          description: ''
  /api/v1/access/users/{id}/role/:
