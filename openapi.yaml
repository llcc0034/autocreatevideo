    get:
      operationId: api_v1_workflow_template_versions_comfyui_workflow_retrieve
      description: Convert one persisted WorkflowTemplateVersion API graph into a
        read-only, importable ComfyUI UI canvas. The operation reads object_info but
        never submits work. Validated/published versions are pinned to validated_deployment;
        an unvalidated draft requires an explicit active ComfyUI deployment_id and
        never falls back to a default. Browsers cannot inject the canvas into another
        ComfyUI page; clients must download and import it.
      parameters:
      - in: query
        name: deployment_id
        schema:
          type: string
          format: uuid
        description: Required only for a draft without validated_deployment. Validated
          and published versions are pinned to their persisted deployment evidence.
      - in: query
        name: download
        schema:
          type: boolean
          default: false
        description: Return the converted ComfyUI UI workflow as a JSON attachment.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: 标识此 workflow template version 的 UUID 字符串。
