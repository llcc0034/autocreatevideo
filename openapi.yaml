openapi: 3.0.3
info:
  title: AutoPrompt Studio API
  version: 1.0.0
  description: 连续短剧、版本化提示词、素材与受管媒体工作流 API
paths:
  /api/v1/acceptance-smoke/:
    get:
      operationId: api_v1_acceptance_smoke_retrieve
      description: Staff-only, paginated, read-only projection of persisted deployment
        and workflow acceptance/smoke facts. It never invokes a provider, changes
        historical states, or creates an attempt. The required subject query selects
        workflow or deployment rows.
      parameters:
      - in: query
        name: deployment_id
        schema:
          type: string
          format: uuid
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          minimum: 1
        description: 每页数量；超过 200 时钳制为 200。
      - in: query
        name: search
        schema:
          type: string
          maxLength: 160
      - in: query
        name: subject
        schema:
          enum:
          - deployment
          - workflow
          type: string
          minLength: 1
        description: |-
          * `deployment` - deployment
          * `workflow` - workflow
        required: true
      - in: query
        name: workflow_id
        schema:
          type: string
          format: uuid
        description: 仅适用于 subject=workflow。
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptanceSmokePage'
          description: 由必填 subject 决定返回 Workflow 或 Deployment 分页；空 results 仍是合法分页。
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationErrorResponse'
          description: ''
  /api/v1/access/audit-events/:
    get:
      operationId: api_v1_access_audit_events_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - bootstrap_superuser
          - change_password
          - change_role
          - change_status
          - create_user
          - reset_password
        description: |-
          * `create_user` - 创建账号
          * `change_role` - 变更角色
          * `change_status` - 变更状态
          * `reset_password` - 重置临时密码
          * `change_password` - 用户修改密码
          * `bootstrap_superuser` - 初始化超级管理员
      - in: query
        name: actor
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: 用于排序结果的字段。
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: 每页返回的结果数量。
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: 搜索关键词。
        schema:
          type: string
      - in: query
        name: target_user
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccessAuditEventList'
          description: ''
  /api/v1/access/audit-events/{id}/:
    get:
      operationId: api_v1_access_audit_events_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: 标识此 access control audit event 的 UUID 字符串。
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessAuditEvent'
          description: ''
  /api/v1/access/users/:
    get:
      operationId: api_v1_access_users_list
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_staff
        schema:
          type: boolean
      - in: query
        name: is_superuser
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: 用于排序结果的字段。
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: 每页返回的结果数量。
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: 搜索关键词。
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccessUserList'
          description: ''
    post:
      operationId: api_v1_access_users_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessUserCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccessUserCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccessUserCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryPasswordResponse'
          description: ''
  /api/v1/access/users/{id}/:
    get:
      operationId: api_v1_access_users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 用户 的 唯一整数值。
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessUser'
          description: ''
  /api/v1/access/users/{id}/role/:
    post:
      operationId: api_v1_access_users_role_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 用户 的 唯一整数值。
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRoleChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccessRoleChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccessRoleChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessUser'
          description: ''
  /api/v1/access/users/{id}/status/:
    post:
      operationId: api_v1_access_users_status_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 用户 的 唯一整数值。
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessStatusChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccessStatusChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccessStatusChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessUser'
          description: ''
  /api/v1/access/users/{id}/temporary-password/:
    post:
      operationId: api_v1_access_users_temporary_password_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 用户 的 唯一整数值。
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemporaryPasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TemporaryPasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TemporaryPasswordResetRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryPasswordResponse'
          description: ''
  /api/v1/assemblies/:
    get:
      operationId: api_v1_assemblies_list
      parameters:
      - in: query
        name: dry_run
        schema:
          type: boolean
      - in: query
        name: episode
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: 用于排序结果的字段。
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: 每页返回的结果数量。
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: string
          format: uuid
      - in: query
        name: scope
        schema:
          type: string
          enum:
          - episode
          - series
        description: |-
          * `episode` - 单集
          * `series` - 整剧
      - name: search
        required: false
        in: query
        description: 搜索关键词。
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - failed
          - planned
          - queued
          - running
          - succeeded
        description: |-
          * `planned` - 已规划
          * `queued` - 排队中
          * `running` - 组装中
          * `succeeded` - 已完成
          * `failed` - 已失败
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssemblyJobList'
          description: ''
  /api/v1/assemblies/{id}/:
    get:
      operationId: api_v1_assemblies_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: 标识此 assembly job 的 UUID 字符串。
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssemblyJob'
          description: ''
  /api/v1/asset-generation-jobs/:
    get:
      operationId: api_v1_asset_generation_jobs_list
      parameters:
      - in: query
        name: job_type
        schema:
          type: string
          enum:
          - asset
          - prompt
        description: |-
          * `prompt` - 提示词候选
          * `asset` - 素材生成
      - in: query
        name: media_type
        schema:
          type: string
          enum:
          - audio
          - image
          - script
          - video
        description: |-
          * `image` - 图片
          * `video` - 视频
          * `audio` - 音频
          * `script` - 剧本
      - name: ordering
        required: false
        in: query
        description: 用于排序结果的字段。
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: 每页返回的结果数量。
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: 搜索关键词。
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancel_requested
          - cancelled
          - failed
          - queued
          - running
          - submitted
          - submitting
          - succeeded
          - uncertain
        description: |-
          * `queued` - 排队中
          * `submitting` - 正在提交
          * `submitted` - 已提交
          * `running` - 运行中
          * `cancel_requested` - 取消中
          * `succeeded` - 已成功
          * `failed` - 已失败
          * `cancelled` - 已取消
          * `uncertain` - 远端状态不确定
      - in: query
        name: style
        schema:
          type: string
          format: uuid
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssetGenerationJobList'
          description: ''
    post:
      operationId: api_v1_asset_generation_jobs_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 同一创建意图必须复用的稳定幂等键；响应丢失后重放不会重复计费。
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetGenerationJobCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetGenerationJobCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetGenerationJobCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetGenerationJob'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetGenerationJob'
          description: ''
  /api/v1/asset-generation-jobs/{id}/:
    get:
      operationId: api_v1_asset_generation_jobs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: 标识此 asset generation job 的 UUID 字符串。
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetGenerationJob'
          description: ''
  /api/v1/asset-generation-jobs/{id}/cancel/:
    post:
      operationId: api_v1_asset_generation_jobs_cancel_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: 标识此 asset generation job 的 UUID 字符串。
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetGenerationJob'
          description: ''
  /api/v1/asset-generation-jobs/{id}/resolve-uncertain/:
    post:
      operationId: api_v1_asset_generation_jobs_resolve_uncertain_create
      description: Append immutable staff evidence for an uncertain asset generation.
        This never repeats the original submit; confirmed media success resumes poll/collect.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 同一管理员消歧意图的稳定幂等键；响应丢失后可安全重放。
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: 标识此 asset generation job 的 UUID 字符串。
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetGenerationResolutionInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetGenerationResolutionInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetGenerationResolutionInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetGenerationResolution'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetGenerationResolution'
          description: ''
  /api/v1/asset-generation-jobs/{id}/retry/:
    post:
      operationId: api_v1_asset_generation_jobs_retry_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 同一重试意图的稳定幂等键；省略时按原任务生成服务端稳定键。
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: 标识此 asset generation job 的 UUID 字符串。
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetGenerationJob'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetGenerationJob'
          description: ''
  /api/v1/asset-generation-jobs/options/:
    get:
      operationId: api_v1_asset_generation_jobs_options_retrieve
      parameters:
      - in: query
        name: job_type
        schema:
          enum:
          - prompt
          - asset
          type: string
          default: asset
          minLength: 1
        description: |-
          * `prompt` - 提示词候选
          * `asset` - 素材生成
      - in: query
        name: media_type
        schema:
          enum:
          - image
          - video
          - audio
          - script
          type: string
          minLength: 1
        description: |-
          * `image` - 图片
          * `video` - 视频
          * `audio` - 音频
          * `script` - 剧本
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetGenerationOptionsResponse'
          description: ''
  /api/v1/assets/:
    get:
      operationId: api_v1_assets_list
      description: 读取当前用户或全局的普通生产素材。metadata.fixture_scope=workflow_smoke 的技术烟测素材不会进入此列表；工作流版本验收页只通过
        workflow-smoke-candidates action 读取它们。
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - audio
          - character
          - output_image
          - output_video
          - prop
          - reference
          - reference_audio
          - reference_video
          - scene
          - script
        description: |-
          * `character` - 人物
          * `scene` - 场景
          * `prop` - 道具
          * `reference` - 参考
          * `reference_video` - 参考视频
          * `reference_audio` - 参考音频
          * `audio` - 音频
          * `script` - 剧本
          * `output_image` - 生成图片
          * `output_video` - 生成视频
      - name: ordering
        required: false
        in: query
        description: 用于排序结果的字段。
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: 每页返回的结果数量。
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: 搜索关键词。
        schema:
          type: string
      - in: query
        name: style
        schema:
          type: string
          format: uuid
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssetList'
          description: ''
    post:
      operationId: api_v1_assets_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
  /api/v1/assets/{id}/:
    get:
      operationId: api_v1_assets_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: 标识此 asset 的 UUID 字符串。
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
    put:
      operationId: api_v1_assets_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: 标识此 asset 的 UUID 字符串。
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
    patch:
      operationId: api_v1_assets_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: 标识此 asset 的 UUID 字符串。
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAssetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAssetRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
    delete:
      operationId: api_v1_assets_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: 标识此 asset 的 UUID 字符串。
