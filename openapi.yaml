    ProductionBuildRequest:
      type: object
      properties:
        template_id:
          type: string
          format: uuid
          nullable: true
        workflow_selections:
          type: array
          items:
            $ref: '#/components/schemas/ProductionWorkflowSelectionRequest'
        episode_ids:
          type: array
          items:
            type: string
            format: uuid
        shot_ids:
          type: array
          items:
            type: string
            format: uuid
        multi_shot:
          type: boolean
          default: true
        include_audio:
          type: boolean
          default: true
          description: 兼容旧客户端；生产任务实际使用每个已保存 Shot 的 include_audio。
        h3_mode:
          allOf:
          - $ref: '#/components/schemas/H3ModeEnum'
          default: T2VA
          description: |-
            兼容旧客户端；生产任务实际使用每个已保存 Shot 的 h3_mode。

            * `T2VA` - Text-to-video with audio
            * `I2VA` - Image-to-video with audio
            * `FL2VA` - First/last frame-to-video with audio
            * `L2VA` - Last-frame-to-video with audio
            * `Ref2VA` - Reference-to-video with audio
        enqueue:
          type: boolean
          default: true
        whole_episode:
          type: boolean
          default: false
        extended_generation_confirmed:
          type: boolean
          default: false
          description: 超过当前任务队列推荐阈值时的显式确认。确认只允许继续排队，不会提高 worker 并发，也不会改变单镜生成参数。
        idempotency_key:
          type: string
          default: ''
