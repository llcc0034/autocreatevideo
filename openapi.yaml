          type: boolean
        reason_code:
          type: string
        message:
          type: string
        evidence_sha256:
          type: string
        stored_target_sha256:
          type: string
        current_target_sha256:
          type: string
        validated_deployment_id:
          type: string
          format: uuid
          nullable: true
      required:
      - current_target_sha256
      - evidence_sha256
      - fresh
      - message
      - reason_code
      - state
      - stored_state
      - stored_target_sha256
      - validated_deployment_id
    WorkflowValidationResponse:
      type: object
      properties:
        version:
          $ref: '#/components/schemas/WorkflowTemplateVersionDetail'
        contract_report: {}
      required:
      - contract_report
      - version
    WorkflowValidationStateEnum:
      enum:
      - not_run
      - passed
      - failed
      type: string
      description: |-
        * `not_run` - 未校验
        * `passed` - 通过
        * `failed` - 失败
    WorkflowVersionStatusEnum:
      enum:
      - draft
      - validated
      - published
      - retired
      type: string
      description: |-
        * `draft` - 草稿
        * `validated` - 已校验
        * `published` - 已发布
        * `retired` - 已停用
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
