      operationId: api_v1_workflows_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: 标识此 generated workflow 的 UUID 字符串。
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedWorkflow'
          description: ''
  /api/v1/workflows/generate/:
    post:
      operationId: api_v1_workflows_generate_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowGenerateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkflowGenerateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkflowGenerateRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedWorkflow'
          description: ''
