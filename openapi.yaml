      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: 每页返回的结果数量。
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: string
          format: uuid
      - in: query
        name: prompt_artifact
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: 搜索关键词。
        schema:
          type: string
      - in: query
        name: template
        schema:
          type: string
          format: uuid
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGeneratedWorkflowList'
          description: ''
  /api/v1/workflows/{id}/:
    get:
      operationId: api_v1_workflows_retrieve
