openapi: 3.0.3
info:
  title: AutoPrompt Studio API
  version: 1.0.0
  description: 连续短剧、MiniMax H3 提示词、素材与 ComfyUI 工作流 API
paths:
  /api/v1/access/audit-events/:
    get:
      operationId: api_v1_access_audit_events_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - bootstrap_superuser
          - change_password
          - change_role
          - change_status
          - create_user
          - reset_password
        description: |-
          * `create_user` - 创建账号
          * `change_role` - 变更角色
          * `change_status` - 变更状态
          * `reset_password` - 重置临时密码
          * `change_password` - 用户修改密码
          * `bootstrap_superuser` - 初始化超级管理员
      - in: query
        name: actor
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: 用于排序结果的字段。
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: 每页返回的结果数量。
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: 搜索关键词。
        schema:
          type: string
      - in: query
        name: target_user
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccessAuditEventList'
          description: ''
  /api/v1/access/audit-events/{id}/:
    get:
      operationId: api_v1_access_audit_events_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: 标识此 access control audit event 的 UUID 字符串。
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessAuditEvent'
          description: ''
  /api/v1/access/users/:
    get:
      operationId: api_v1_access_users_list
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_staff
        schema:
          type: boolean
      - in: query
        name: is_superuser
