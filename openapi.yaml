        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessUser'
          description: ''
  /api/v1/access/users/{id}/status/:
    post:
      operationId: api_v1_access_users_status_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 用户 的 唯一整数值。
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessStatusChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccessStatusChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccessStatusChangeRequest'
        required: true
      security:
      - jwtAuth: []
