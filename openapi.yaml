openapi: 3.0.3
info:
  title: AutoPrompt Studio API
  version: 1.0.0
  description: 连续短剧、MiniMax H3 提示词、素材与 ComfyUI 工作流 API
paths:
  /api/v1/assemblies/:
    get:
      operationId: api_v1_assemblies_list
      parameters:
      - in: query
        name: dry_run
        schema:
          type: boolean
      - in: query
        name: episode
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: 用于排序结果的字段。
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: 每页返回的结果数量。
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: string
          format: uuid
      - in: query
        name: scope
        schema:
          type: string
          enum:
          - episode
          - series
        description: |-
          * `episode` - 单集
          * `series` - 整剧
      - name: search
        required: false
        in: query
        description: 搜索关键词。
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - failed
          - planned
          - queued
          - running
          - succeeded
        description: |-
          * `planned` - 已规划
          * `queued` - 排队中
          * `running` - 组装中
          * `succeeded` - 已完成
          * `failed` - 已失败
      tags:
      - api
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssemblyJobList'
          description: ''
  /api/v1/assemblies/{id}/:
    get:
      operationId: api_v1_assemblies_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: 标识此 assembly job 的 UUID 字符串。
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssemblyJob'
          description: ''
  /api/v1/assemblies/episode/:
    post:
      operationId: api_v1_assemblies_episode_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssembleEpisodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssembleEpisodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssembleEpisodeRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssemblyJob'
          description: ''
  /api/v1/assemblies/series/:
    post:
      operationId: api_v1_assemblies_series_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssembleSeriesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssembleSeriesRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssembleSeriesRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssemblyJob'
          description: ''
  /api/v1/assets/:
    get:
      operationId: api_v1_assets_list
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - audio
          - character
          - output_image
          - output_video
          - prop
          - reference
          - reference_audio
          - reference_video
          - scene
        description: |-
          * `character` - 人物
          * `scene` - 场景
          * `prop` - 道具
          * `reference` - 参考
          * `reference_video` - 参考视频
          * `reference_audio` - 参考音频
          * `audio` - 音频
          * `output_image` - 生成图片
          * `output_video` - 生成视频
      - name: ordering
        required: false
        in: query
        description: 用于排序结果的字段。
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: 每页返回的结果数量。
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: 搜索关键词。
        schema:
          type: string
      - in: query
        name: style
        schema:
          type: string
          format: uuid
      tags:
      - api
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssetList'
          description: ''
    post:
      operationId: api_v1_assets_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
  /api/v1/assets/{id}/:
    get:
      operationId: api_v1_assets_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: 标识此 asset 的 UUID 字符串。
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
    put:
      operationId: api_v1_assets_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: 标识此 asset 的 UUID 字符串。
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
    patch:
      operationId: api_v1_assets_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: 标识此 asset 的 UUID 字符串。
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAssetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAssetRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
    delete:
      operationId: api_v1_assets_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: 标识此 asset 的 UUID 字符串。
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: api_v1_auth_me_retrieve
      tags:
      - api
      security:
